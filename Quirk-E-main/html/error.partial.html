<div id="error-div" class="qlp-error-toast" style="display:none;">
    <div class="qlp-error-header">
        <i class="fa-solid fa-circle-exclamation"></i>
        <div id="error-happened-div" class="qlp-error-title">An unexpected error occurred</div>
    </div>
    <div id="error-message-div" class="qlp-error-message"></div>
    <div id="error-known-div">
        <a id="error-known-issue-anchor" class="qlp-link">View known issue discussion on GitHub</a>
    </div>
    <div id="error-report-div" class="qlp-error-report">
        <span>Report issue:</span>
        <ul class="qlp-error-list">
            <li>
                <a id="error-github-anchor" class="qlp-link">Create an issue on GitHub</a>
            </li>
            <li>
                or <a id="error-mailto-anchor" class="qlp-link"></a>
            </li>
        </ul>
        <div class="qlp-error-details">
            <div id="error-description-div"></div>
            <img id="error-image-pre" src="#" class="qlp-error-img" alt="Pre-render error snapshot"/>
            <img id="error-image-post" src="#" class="qlp-error-img" alt="Post-render error snapshot"/>
        </div>
    </div>
</div>
